<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>staylazy</title>
    <script>
      const showErr = (m) => {
        let el = document.getElementById("boot-error");
        if (!el) {
          el = document.createElement("pre");
          el.id = "boot-error";
          el.style.cssText =
            "position:fixed;inset:0;background:#300;color:#f99;padding:20px;font-size:13px;z-index:9999;white-space:pre-wrap";
          (document.body || document.documentElement).appendChild(el);
        }
        el.textContent += m + "\n";
      };
      window.addEventListener("error", (e) =>
        showErr(`ERR ${e.message} @${e.filename}:${e.lineno}`),
      );
      window.addEventListener("unhandledrejection", (e) =>
        showErr(`REJ ${String(e.reason)}`),
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
