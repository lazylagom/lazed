[package]
name = "staylazy"
version = "0.0.1"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "staylazy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-notification = "2.4.0"
