  <rect x="102" y="102" width="820" height="820" rx="188" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/>
  <g filter="url(#ink)" fill="none" stroke="#0A1F16" stroke-width="84" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="322,362 500,512 322,662"/>
