[package]
name = "lazed"
version = "0.1.0"
edition = "2021"
description = "lazed daemon — organization layer over herdr (group > project > herdr workspace), worktrees, tasks, inbox"

[[bin]]
name = "lazed"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
