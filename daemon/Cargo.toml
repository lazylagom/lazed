[package]
name = "lazed"
version = "0.1.0"
edition = "2021"
description = "lazed daemon — headless terminal workspace manager (session > project > terminal)"

[[bin]]
name = "lazed"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9"
alacritty_terminal = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
libc = "0.2"
# rustix-openpty leaves rustix's `std` feature off; without it rustix::fd::AsFd
# is a private trait std::os::fd::OwnedFd doesn't implement. Enabling `std`
# here unifies the feature set and lets alacritty_terminal's tty code compile.
rustix = { version = "0.38", features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
